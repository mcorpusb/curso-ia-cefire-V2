- id: PRI-01
  title: "El supermercat dels nombres"
  area: "Matemàtiques"
  goal: "Crear un supermercat fictici per a practicar operacions, estimació i decisions de compra."
  simple: "Crea problemes de matemàtiques sobre un supermercat."
  context: "Taller de resolució de problemes amb preus ficticis i compra responsable."
  students: "[curs de Primària]; indica quines operacions domina el grup."
  objective: "Estimar, calcular i explicar estratègies en resoldre una compra."
  restrictions: "12 productes, preus adequats al curs, pressupost tancat, tres reptes graduats i solucions raonades; sense marques reals. Comprova totes les operacions i el canvi."
  format: "Llista de preus, tres missions, suports opcionals i solucions separades per al docent."
  iteration: "Adapta el mateix supermercat a [curs], mantín els productes i canvia la dificultat. Comprova de nou cada càlcul i explica què ha canviat en l’exigència cognitiva."
  result: "Una activitat matemàtica graduada, llesta per a revisar i imprimir."
- id: PRI-02
  title: "Detectius de notícies"
  area: "Llengua i pensament crític"
  goal: "Comparar textos ficticis i aprendre a distingir fets, opinions, pistes i preguntes pendents."
  simple: "Fes una activitat sobre notícies falses."
  context: "Comprensió lectora i alfabetització mediàtica amb textos completament ficticis."
  students: "5é de Primària; experiència inicial a diferenciar fet i opinió."
  objective: "Justificar la fiabilitat d’una notícia mitjançant evidències del text i preguntes de verificació."
  restrictions: "Dues notícies breus sobre el mateix fet escolar fictici, una més fiable que l’altra; llenguatge apropiat, sense alarmisme ni enllaços inventats. Inclou pistes, solució raonada i avís que cal contrastar."
  format: "Dos textos, taula d’evidències, sis preguntes i guia docent separada."
  iteration: "Elimina pistes massa evidents, afig una afirmació que requerisca buscar una font pública i explica quina font seria adequada sense inventar referències."
  result: "Una miniinvestigació de lectura crítica amb materials ficticis i pautes de contrast."
- id: PRI-03
  title: "La nostra escola sostenible"
  area: "Coneixement del Medi"
  goal: "Plantejar reptes de millora sobre residus, aigua o energia vinculats a l’escola."
  simple: "Prepara una activitat sobre sostenibilitat."
  context: "Situació d’aprenentatge breu sobre un problema ambiental observable del centre."
  students: "4t–6é de Primària, treball cooperatiu en equips."
  objective: "Interpretar dades fictícies, proposar una millora viable i justificar com mesurar-ne l’efecte."
  restrictions: "Tria residus, aigua o energia; usa dades clarament marcades com a simulades, tres reptes menuts, materials comuns i una acció realitzable sense obres ni despesa. No presentes estimacions com a mesuraments reals."
  format: "Cas, taula de dades, reptes, plantilla de proposta i preguntes per a avaluar la viabilitat."
  iteration: "Introduïx una restricció nova —pressupost màxim de 30 euros— i demana que prioritze les mesures amb criteris transparents sense inventar dades del centre."
  result: "Un repte sostenible amb dades fictícies i una proposta verificable."
  adaptation: "En Infantil pot centrar-se a classificar residus; en Secundària, en consum energètic; en FP, en eficiència tècnica."
- id: PRI-04
  title: "Aprenem història amb preguntes"
  area: "Història local i patrimoni"
  goal: "Preparar una indagació sobre patrimoni local basada en preguntes i fonts comprovables."
  simple: "Conta’m la història d’un monument de la meua localitat."
  context: "Investigació guiada sobre [lloc o element patrimonial] usant només fonts aportades pel docent o enllaços institucionals verificats."
  students: "6é de Primària; iniciació a l’ús de fonts."
  objective: "Diferenciar què afirma una font, què permet inferir i què encara cal investigar."
  restrictions: "No inventes dates, personatges, citacions ni fonts; marca com a ‘dada per verificar’ qualsevol aspecte no sustentat. Formula preguntes abans d’explicar i separa fets d’interpretacions."
  format: "Guió amb huit preguntes, taula font–evidència i síntesi final de 150 paraules."
  iteration: "Audita la resposta: enumera cada afirmació històrica, vincula-la a una font aportada i retira o marca les que no estiguen sustentades."
  result: "Una investigació guiada amb informació rastrejable fins a fonts reals."
- id: PRI-05
  title: "Creem ritmes amb objectes quotidians"
  area: "Música"
  goal: "Dissenyar una creació rítmica cooperativa amb percussió corporal i objectes segurs de l’aula."
  simple: "Fes una activitat per a crear ritmes."
  context: "Sessió musical cooperativa sense instruments específics."
  students: "3r–6é de Primària, amb experiència musical diversa."
  objective: "Reconéixer patrons, mantindre la pulsació i coordinar una composició breu en grup."
  restrictions: "25 minuts, volum moderat, objectes segurs, patrons de 4 i 8 pulsacions, rols alternatius i opció sense impacte sonor. No uses objectes fràgils ni contacte corporal."
  format: "Calfament, tres patrons escrits amb notació accessible, creació per equips i tancament d’escolta."
  iteration: "Simplifica un patró i amplia’n un altre sense canviar la pulsació; afig suports visuals i una alternativa per a alumnat sensible al soroll."
  result: "Una seqüència musical cooperativa amb patrons i alternatives de participació."
  adaptation: "En Infantil enllaça emoció i moviment; en Secundària pot convertir-se en paisatge sonor."
- id: PRI-06
  title: "El meu primer algoritme"
  area: "Pensament computacional"
  goal: "Treballar seqüències, decisions i depuració sense necessitat de programar."
  simple: "Crea una activitat sobre algoritmes per a xiquets i xiquetes."
  context: "Repte desendollat: guiar un robot fictici per un laberint o descriure una recepta."
  students: "4t–6é de Primària; no calen coneixements de programació."
  objective: "Escriure instruccions precises, detectar ambigüitats i corregir una seqüència."
  restrictions: "Inclou seqüència, una decisió ‘si… aleshores…’, un error deliberat i proves sobre paper; no uses dispositius ni dades personals. Oferix suport amb targetes d’accions."
  format: "Tauler o situació textual, instruccions, casos de prova, pistes graduades i solució explicada."
  iteration: "Introduïx un obstacle nou i demana modificar el menor nombre possible de passos. Comprova la solució executant-la pas a pas."
  result: "Un repte desendollat amb algoritme, prova i depuració."
  adaptation: "En Infantil es limita a ordenar accions; en Secundària passa a pseudocodi i en FP a proves de programari."
- id: PRI-07
  title: "Una tasca, diferents camins"
  area: "DUA i inclusió"
  goal: "Adaptar una tasca comuna sense rebaixar-ne l’objectiu essencial."
  simple: "Adapta esta activitat per a alumnat amb dificultats."
  context: "Una activitat de Ciències o Llengua que el docent descriurà sense aportar perfils identificables."
  students: "Grup heterogeni de Primària; usa necessitats funcionals fictícies, no diagnòstics."
  objective: "Mantindre l’aprenentatge comú i oferir diferents formes d’accés, suport i expressió."
  restrictions: "Aplica DUA, proposa tres nivells de bastiment, llenguatge respectuós i opcions oral, escrita, visual o manipulativa. No reduïsques l’objectiu ni assignes adaptacions a etiquetes personals."
  format: "Taula barrera–suport–evidència d’aprenentatge i tres versions d’instruccions."
  iteration: "Compara les tres rutes, detecta si alguna canvia l’objectiu essencial i corregix-la perquè varie el suport, no l’expectativa d’aprenentatge."
  result: "Una activitat accessible amb rutes equivalents i criteris comuns."
