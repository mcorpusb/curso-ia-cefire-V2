- id: FP-01
  title: "Edificación y Obra Civil — Vivienda sostenible"
  area: "Edificación y Obra Civil"
  goal: "Comparar soluciones de aislamiento y eficiencia energética en un caso técnico ficticio."
  simple: "Diseña una vivienda sostenible."
  context: "Anteproyecto simulado de mejora de una vivienda en clima mediterráneo."
  students: "Ciclo de Edificación y Obra Civil; nivel [GM/GS]."
  objective: "Comparar materiales mediante prestaciones, coste y limitaciones, justificando una recomendación."
  restrictions: "Datos y precios ficticios claramente señalados, tres soluciones, unidades coherentes, cálculos trazables y aspectos técnicos por verificar. No cites normativa inexistente ni afirmes certificaciones."
  format: "Ficha del caso, tabla comparativa, cálculo simplificado, recomendación y lista de comprobaciones técnicas."
  iteration: "Limita el presupuesto a [cantidad], revisa unidades y cálculos y separa los datos simulados de los valores que habría que obtener de fichas técnicas reales."
  result: "Un caso técnico comparativo con supuestos y verificaciones visibles."
  adaptation: "En Primaria se centra en hábitos sostenibles; en Secundaria, en consumo energético."
- id: FP-02
  title: "Integración Social — Intervención inclusiva"
  area: "Servicios Socioculturales"
  goal: "Diseñar una intervención socioeducativa evaluable para un centro comunitario ficticio."
  simple: "Haz un proyecto de integración social."
  context: "Centro comunitario ficticio que quiere aumentar la participación en una actividad compartida."
  students: "Ciclo de Integración Social; trabajo con perfiles y datos totalmente ficticios."
  objective: "Relacionar necesidades, objetivos, actividades, recursos e indicadores de evaluación."
  restrictions: "Evita diagnósticos, estereotipos y promesas de impacto; incluye participación de las personas destinatarias, accesibilidad, recursos limitados y protocolo de revisión profesional."
  format: "Matriz necesidad–objetivo–actividad–recurso–indicador, cronograma breve y riesgos."
  iteration: "Revisa la coherencia vertical de la matriz y sustituye indicadores vagos por señales observables y alcanzables sin recoger datos sensibles."
  result: "Un proyecto socioeducativo coherente, respetuoso y evaluable."
- id: FP-03
  title: "DAM — Depuramos una aplicación Java"
  area: "Desarrollo de Aplicaciones Multiplataforma"
  goal: "Localizar dos errores lógicos en una aplicación Java sencilla de inventario."
  simple: "Genera un programa Java con errores para practicar."
  context: "Práctica de depuración de una aplicación de inventario ficticio."
  students: "1.º de DAM; conocen clases, métodos, colecciones y control de flujo."
  objective: "Diseñar pruebas, localizar fallos, explicar causas y corregir el código."
  restrictions: "Máximo 60 líneas, dos errores lógicos deliberados, sin red, archivos, credenciales ni código dañino; no reveles inicialmente la solución. Incluye casos de prueba y pistas progresivas."
  format: "Enunciado, código compilable, tabla de pruebas, pistas, solución razonada y dos mejoras."
  iteration: "Adapta la dificultad a alumnado principiante: conserva los dos fallos, simplifica la estructura y mejora las pistas sin revelar directamente las líneas erróneas."
  result: "Una práctica Java segura con pruebas y solución explicada."
- id: FP-04
  title: "DAW — Diseñamos una web accesible"
  area: "Desarrollo de Aplicaciones Web"
  goal: "Crear una página básica y auditar de forma razonada su accesibilidad."
  simple: "Crea una web accesible con un formulario."
  context: "Página ficticia de inscripción a una jornada escolar."
  students: "1.º de DAW; conocen HTML semántico y CSS básico."
  objective: "Relacionar estructura semántica, formularios, teclado, foco y diseño adaptable."
  restrictions: "HTML y CSS breves, sin dependencias, etiquetas explícitas, mensajes de error comprensibles, foco visible y orden lógico. No afirmes conformidad WCAG completa sin evaluación real."
  format: "Código separado, lista de comprobaciones manuales y hallazgos con prioridad."
  iteration: "Audita el código generado con teclado y criterios básicos de accesibilidad; identifica límites de la revisión automática y entrega una versión corregida explicando cada cambio."
  result: "Un prototipo web y una auditoría básica que no confunde revisión con certificación."
- id: FP-05
  title: "SMR — Diagnosticamos una red local"
  area: "Sistemas Microinformáticos y Redes"
  goal: "Resolver una incidencia simulada de conectividad siguiendo una secuencia de diagnóstico."
  simple: "Crea una avería de red para resolver."
  context: "Un equipo ficticio no accede a un servidor de laboratorio."
  students: "1.º de SMR; conocen IPv4, máscara, puerta de enlace y DNS."
  objective: "Formular hipótesis, interpretar salidas simuladas y aislar la causa antes de proponer cambios."
  restrictions: "Solo IP privadas y dominios reservados, salidas ficticias de ipconfig/ip/ping/nslookup, sin credenciales ni infraestructura real. Incluye una única causa inicial y solución razonada."
  format: "Ticket, topología textual, salidas, tabla hipótesis–prueba–resultado, pistas y solución."
  iteration: "Añade una segunda incidencia de DNS sin alterar la primera. Actualiza las salidas simuladas y explica cómo distinguir ambos fallos."
  result: "Una práctica reproducible de diagnóstico con datos seguros y ficticios."
- id: FP-06
  title: "ASIR y Redes — Diseña y verifica una red empresarial"
  area: "Administración de Sistemas y Redes"
  goal: "Diseñar una red segmentada y comprobar su direccionamiento en simulación."
  simple: "Diseña la red de una empresa pequeña."
  context: "Empresa ficticia con Administración, Ventas, Taller y servidores."
  students: "ASIR o módulo avanzado de redes; trabajo en simulador cuando esté disponible."
  objective: "Planificar subredes, VLAN, encaminamiento y pruebas de conectividad con medidas básicas de seguridad."
  restrictions: "Rangos privados ficticios, cuatro departamentos, requisitos de hosts, tabla VLAN, topología lógica y reglas mínimas; no uses redes, nombres ni credenciales reales. No presentes la configuración como verificada."
  format: "Plan de direccionamiento, tabla de puertos/VLAN, diagrama textual, configuraciones orientativas y plan de pruebas."
  iteration: "Audita el plan de direccionamiento, detecta solapamientos o puertas de enlace inválidas y genera una tabla corregida. Señala qué comprobar en Packet Tracer."
  result: "Un diseño de red listo para validar en simulación, con conflictos corregidos."
- id: FP-07
  title: "Administración y Finanzas — ¿Cuánto cuesta realmente?"
  area: "Administración y Finanzas"
  goal: "Simular presupuesto, márgenes y control de gastos en una pequeña empresa ficticia."
  simple: "Haz un presupuesto para una empresa."
  context: "Pequeña empresa ficticia que prepara su presupuesto mensual."
  students: "Ciclo de Administración y Finanzas; nivel adaptable."
  objective: "Calcular ingresos, costes, margen y desviaciones y justificar decisiones."
  restrictions: "Datos ficticios coherentes, costes fijos y variables, impuestos simplificados claramente indicados, tres escenarios y fórmulas visibles. Comprueba operaciones; no lo presentes como asesoramiento fiscal."
  format: "Tabla de operaciones, resultados por escenario, cinco preguntas y solución."
  iteration: "Modifica los precios un [porcentaje], recalcula márgenes y comprueba cada fórmula. Explica qué supuestos limitan la conclusión."
  result: "Una simulación presupuestaria con cálculos auditables y escenarios."
- id: FP-08
  title: "Desarrollo de software — Pruebas y calidad"
  area: "DAM y DAW"
  goal: "Traducir requisitos de una función sencilla en casos de prueba útiles."
  simple: "Genera pruebas para una aplicación."
  context: "Función ficticia de registro que valida usuario, contraseña y edad."
  students: "DAM/DAW; conocen requisitos y pruebas unitarias básicas."
  objective: "Derivar entradas válidas, inválidas y límite y comparar resultados esperados y reales."
  restrictions: "Requisitos claros, datos ficticios, sin credenciales reales, casos positivos, negativos y de frontera; incluye dos requisitos ambiguos para que el alumnado los detecte."
  format: "Tabla id–requisito–precondición–entrada–resultado esperado–prioridad y apartado de incidencias."
  iteration: "Revisa la cobertura, añade los casos límite que falten y reformula los requisitos ambiguos antes de actualizar los resultados esperados."
  result: "Un plan de pruebas trazable con ambigüedades y mejoras identificadas."
  adaptation: "En Primaria parte de probar secuencias; en Secundaria, de depurar un programa breve."
- id: FP-09
  title: "Comercio — Diseñamos un escaparate que vende"
  area: "Comercio y Marketing"
  goal: "Planificar un escaparate de temporada relacionando público, concepto visual, presupuesto e indicadores."
  simple: "Prepara una actividad sobre escaparatismo."
  context: "Caso profesional para una tienda ficticia de ropa sostenible durante una campaña de temporada."
  students: "Ciclo formativo de Actividades Comerciales."
  objective: "Justificar decisiones de escaparatismo según el público objetivo, el espacio, los recursos y la finalidad comercial."
  restrictions: "Presupuesto ficticio de 350 euros, productos y tienda inventados, recursos realistas, criterios de accesibilidad y seguridad; no atribuyas resultados de venta reales."
  format: "Caso profesional, instrucciones, esquema de distribución, tabla de recursos y costes e indicadores sencillos."
  iteration: "Adapta el escaparate a un espacio de 2 metros de ancho y un presupuesto máximo de 180 euros. Conserva el concepto de campaña y justifica qué elementos priorizas o eliminas."
  result: "Una propuesta de escaparate coherente, presupuestada y justificable."
  adaptation: "En Primaria enlaza con el supermercado y las operaciones; en Secundaria, con presupuesto y consumo responsable."
- id: FP-10
  title: "Marketing — Lanzamos una campaña digital"
  area: "Marketing y Publicidad"
  goal: "Diseñar una campaña digital ética y medible para un producto sostenible ficticio."
  simple: "Crea una campaña de marketing."
  context: "Empresa ficticia que quiere lanzar una botella reutilizable."
  students: "Ciclo formativo de Marketing y Publicidad."
  objective: "Relacionar segmentación, propuesta de valor, mensajes, canales, presupuesto e indicadores."
  restrictions: "Público objetivo ficticio, objetivos medibles, tres publicaciones, calendario semanal, presupuesto simulado, indicadores y comunicación ética. No uses perfiles personales reales ni afirmaciones ambientales sin respaldo."
  format: "Tablas de estrategia, publicaciones, calendario, presupuesto e indicadores con supuestos explícitos."
  iteration: "Cambia el público objetivo de [segmento inicial] a [nuevo segmento]. Reescribe los mensajes y canales, conserva el presupuesto y compara qué decisiones han cambiado y por qué."
  result: "Una campaña semanal segmentada, evaluable y respetuosa con la comunicación ética."
  adaptation: "En Primaria puede analizar anuncios sencillos; en Secundaria, consumo responsable y viabilidad económica."
- id: FP-11
  title: "Estética — Diseñamos una atención profesional personalizada"
  area: "Imagen Personal"
  goal: "Simular una atención estética segura, respetuosa y limitada al ámbito profesional no sanitario."
  simple: "Prepara una actividad de estética."
  context: "Atención a una clienta ficticia que solicita un servicio básico de cuidado estético facial."
  students: "Ciclo formativo de Estética y Belleza."
  objective: "Realizar una entrevista profesional, identificar preferencias, proponer cuidados cosméticos generales y reconocer cuándo derivar."
  restrictions: "Perfiles ficticios, preguntas de seguridad, higiene, productos justificados y criterios de atención; no hagas diagnósticos médicos ni recomendaciones clínicas y marca contraindicaciones que requieran derivación."
  format: "Guion de recepción y entrevista, ficha profesional anonimizada, propuesta, productos, seguridad y lista de observación."
  iteration: "Adapta la propuesta a una clienta ficticia con presupuesto limitado y preferencia por productos sin perfume. No presupongas que esos productos son adecuados para todas las personas: indica qué debe comprobar la profesional."
  result: "Una simulación de asesoramiento con límites, seguridad y comunicación profesional explícitos."
- id: FP-12
  title: "Peluquería — Asesoramiento de imagen y servicio"
  area: "Peluquería y Cosmética Capilar"
  goal: "Preparar una entrevista y una propuesta de servicio que respondan a preferencias, tiempo y mantenimiento."
  simple: "Diseña una actividad sobre peluquería."
  context: "Supuesto práctico para una clienta ficticia que desea un cambio de estilo."
  students: "Ciclo formativo de Peluquería y Cosmética Capilar."
  objective: "Recoger expectativas, comparar opciones de corte y peinado y justificar un servicio viable y seguro."
  restrictions: "Incluye tiempo, material, presupuesto, higiene y comunicación profesional. No diagnostiques cuero cabelludo o cabello ni propongas procedimientos químicos sin evaluación profesional y medidas de seguridad."
  format: "Ficha de entrevista, tres opciones comparadas, propuesta razonada, planificación del servicio y criterios de observación."
  iteration: "Adapta la propuesta a un servicio de bajo mantenimiento que deba completarse en 60 minutos. Explica qué opción descartas y por qué."
  result: "Una simulación de asesoramiento capilar con alternativas, presupuesto y límites profesionales."
- id: FP-13
  title: "Hostelería — Diseñamos un menú sostenible"
  area: "Cocina y Gastronomía"
  goal: "Planificar un menú de tres platos calculando cantidades, coste y organización con criterios de sostenibilidad."
  simple: "Prepara un menú para un restaurante."
  context: "Restaurante ficticio de la Comunitat Valenciana que prepara un servicio para diez comensales."
  students: "Ciclos de Cocina y Gastronomía o Dirección de Cocina."
  objective: "Realizar un escandallo simplificado, razonar el precio y organizar el trabajo reduciendo desperdicios."
  restrictions: "Ingredientes de temporada, cantidades para diez, costes orientativos ficticios, higiene alimentaria y alérgenos por verificar. No garantices ausencia de alérgenos sin revisar ingredientes, trazas y manipulación."
  format: "Tablas de menú, cantidades, escandallo, precio, organización, alérgenos pendientes y aprovechamiento."
  iteration: "Crea una alternativa vegetariana, recalcula cantidades, costes y precio paso a paso y explica qué alérgenos y fichas técnicas deben volver a verificarse."
  result: "Un menú profesional simulado con escandallo y comprobaciones alimentarias pendientes identificadas."
  adaptation: "En Infantil puede clasificar alimentos; en Primaria, planificar un desayuno como actividad educativa general; en Secundaria, trabajar presupuesto y consumo responsable."
- id: FP-14
  title: "Jardinería y Medioambiente — Un jardín adaptado al clima mediterráneo"
  area: "Jardinería, Paisajismo y Medio Natural"
  goal: "Diseñar un espacio verde sostenible considerando clima, agua, biodiversidad, mantenimiento y contexto local."
  simple: "Diseña un jardín sostenible."
  context: "Jardín mediterráneo ficticio de 100 m² en un centro educativo de la provincia de Alicante."
  students: "Ciclos de Jardinería, Paisajismo o Medio Natural."
  objective: "Justificar distribución, especies, riego, materiales y mantenimiento con criterios de sostenibilidad."
  restrictions: "Condiciones climáticas generales, sombra, especies propuestas, riego orientativo, presupuesto ficticio y biodiversidad. Advierte que deben comprobarse suelo, agua, especies invasoras, disponibilidad comercial y condiciones locales."
  format: "Ficha del emplazamiento, plano textual por zonas, tabla de especies y recursos, presupuesto, mantenimiento y lista de verificaciones."
  iteration: "Adapta el diseño a restricciones de agua más severas. Reduce la demanda estimada, justifica cambios de especies y distribución y señala qué datos locales necesitas antes de validar la propuesta."
  result: "Un anteproyecto de jardín mediterráneo con presupuesto, mantenimiento y límites técnicos visibles."
  adaptation: "En Infantil enlaza con plantar una semilla; en Primaria, con cuidar un huerto; en Secundaria, con automatizar el riego."

