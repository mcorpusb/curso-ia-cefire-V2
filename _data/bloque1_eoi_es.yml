- id: EOI-01
  title: "Una conversación en una situación real"
  area: "Interacción oral"
  goal: "Diseñar una simulación comunicativa ajustada al idioma y al nivel del MCER."
  simple: "Crea una conversación para practicar [idioma]."
  context: "Situación verosímil elegida por el docente: alojamiento, salud cotidiana, compra, gestión o viaje."
  students: "EOI de [idioma], nivel [A1–C2], alumnado joven y adulto."
  objective: "Resolver una necesidad comunicativa concreta mediante interacción y negociación de significado."
  restrictions: "Registro y complejidad propios del nivel, roles equilibrados, apoyos graduados, lenguaje no infantilizado y cinco expresiones funcionales. Evita datos personales y estereotipos culturales."
  format: "Tarjetas de rol, información que falta a cada parte, banco de expresiones y cierre de autoevaluación."
  iteration: "Ajusta la tarea exactamente a [nivel MCER]: revisa longitud, velocidad prevista, funciones lingüísticas y apoyos; explica dos cambios realizados."
  result: "Una simulación oral funcional con apoyos adecuados al nivel."
- id: EOI-02
  title: "Debate con diferentes niveles de apoyo"
  area: "Argumentación e interacción"
  goal: "Organizar un debate con andamiaje graduado sin cambiar el propósito comunicativo."
  simple: "Prepara un debate en [idioma]."
  context: "Debate sobre una cuestión cotidiana y no sensible relevante para personas adultas."
  students: "EOI, nivel [B1/B2/C1], grupo heterogéneo."
  objective: "Expresar postura, pedir aclaraciones, matizar y responder a argumentos."
  restrictions: "Tres niveles de apoyo —expresiones, guion y autonomía—, perspectivas plausibles, turnos equitativos y criterios comunicativos. No penalices una postura concreta."
  format: "Tema, información base ficticia, tarjetas de postura, apoyos por nivel y lista de observación."
  iteration: "Reduce el apoyo del nivel avanzado, añade reformulación al nivel medio y un banco de iniciadores al nivel de apoyo, manteniendo el mismo objetivo."
  result: "Un debate común con diferentes grados de andamiaje."
- id: EOI-03
  title: "Mediación lingüística"
  area: "Mediación"
  goal: "Preparar una tarea en la que el alumnado transmita información útil a otra persona."
  simple: "Crea una tarea de mediación lingüística."
  context: "Una persona necesita comprender un folleto, mensaje o instrucciones ficticias en una situación cotidiana."
  students: "EOI de [idioma], nivel [A2–C1]."
  objective: "Seleccionar, reformular y transmitir la información relevante para un destinatario concreto."
  restrictions: "Texto fuente ficticio adecuado al nivel, propósito y destinatario claros, sin traducción literal obligatoria, límites de extensión y criterios de adecuación."
  format: "Situación, texto fuente, consigna, apoyos opcionales y tres preguntas de revisión."
  iteration: "Cambia el destinatario y su necesidad comunicativa; ajusta qué información debe priorizarse y comprueba que la tarea sigue midiendo mediación, no memoria."
  result: "Una tarea de mediación contextualizada y evaluable."
- id: EOI-04
  title: "Mejoramos un texto"
  area: "Producción escrita"
  goal: "Comparar un borrador ficticio con una revisión de IA sin aceptar cambios automáticamente."
  simple: "Corrige este texto en [idioma]."
  context: "Revisión de un correo, reseña o texto argumentativo ficticio."
  students: "EOI de [idioma], nivel [B1–C1]."
  objective: "Valorar adecuación, cohesión, registro, corrección y posibles cambios de significado."
  restrictions: "Conserva la voz del autor, justifica cada cambio, distingue error de mejora estilística y marca cualquier alteración de significado. No reescribas todo sin explicación."
  format: "Tabla fragmento original–propuesta–motivo–decisión del estudiante y versión final."
  iteration: "Revisa tus sugerencias: retira cambios innecesarios, señala dos alternativas válidas y adapta el registro al destinatario sin elevar artificialmente el nivel."
  result: "Una revisión argumentada en la que el alumnado decide qué cambios acepta."
