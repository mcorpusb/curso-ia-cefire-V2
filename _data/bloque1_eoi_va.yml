- id: EOI-01
  title: "Una conversa en una situació real"
  area: "Interacció oral"
  goal: "Dissenyar una simulació comunicativa ajustada a l’idioma i al nivell del MECR."
  simple: "Crea una conversa per a practicar [idioma]."
  context: "Situació versemblant triada pel docent: allotjament, salut quotidiana, compra, gestió o viatge."
  students: "EOI d’[idioma], nivell [A1–C2], alumnat jove i adult."
  objective: "Resoldre una necessitat comunicativa concreta mitjançant interacció i negociació de significat."
  restrictions: "Registre i complexitat propis del nivell, rols equilibrats, suports graduats, llenguatge no infantilitzat i cinc expressions funcionals. Evita dades personals i estereotips culturals."
  format: "Targetes de rol, informació que falta a cada part, banc d’expressions i tancament d’autoavaluació."
  iteration: "Ajusta la tasca exactament a [nivell MECR]: revisa longitud, velocitat prevista, funcions lingüístiques i suports; explica dos canvis realitzats."
  result: "Una simulació oral funcional amb suports adequats al nivell."
- id: EOI-02
  title: "Debat amb diferents nivells de suport"
  area: "Argumentació i interacció"
  goal: "Organitzar un debat amb bastiment graduat sense canviar el propòsit comunicatiu."
  simple: "Prepara un debat en [idioma]."
  context: "Debat sobre una qüestió quotidiana i no sensible rellevant per a persones adultes."
  students: "EOI, nivell [B1/B2/C1], grup heterogeni."
  objective: "Expressar postura, demanar aclariments, matisar i respondre a arguments."
  restrictions: "Tres nivells de suport —expressions, guió i autonomia—, perspectives plausibles, torns equitatius i criteris comunicatius. No penalitzes una postura concreta."
  format: "Tema, informació base fictícia, targetes de postura, suports per nivell i llista d’observació."
  iteration: "Reduïx el suport del nivell avançat, afig reformulació al nivell mitjà i un banc d’iniciadors al nivell de suport, mantenint el mateix objectiu."
  result: "Un debat comú amb diferents graus de bastiment."
- id: EOI-03
  title: "Mediació lingüística"
  area: "Mediació"
  goal: "Preparar una tasca en què l’alumnat transmeta informació útil a una altra persona."
  simple: "Crea una tasca de mediació lingüística."
  context: "Una persona necessita comprendre un fullet, missatge o instruccions fictícies en una situació quotidiana."
  students: "EOI d’[idioma], nivell [A2–C1]."
  objective: "Seleccionar, reformular i transmetre la informació rellevant per a un destinatari concret."
  restrictions: "Text font fictici adequat al nivell, propòsit i destinatari clars, sense traducció literal obligatòria, límits d’extensió i criteris d’adequació."
  format: "Situació, text font, consigna, suports opcionals i tres preguntes de revisió."
  iteration: "Canvia el destinatari i la seua necessitat comunicativa; ajusta quina informació s’ha de prioritzar i comprova que la tasca continua mesurant mediació, no memòria."
  result: "Una tasca de mediació contextualitzada i avaluable."
- id: EOI-04
  title: "Millorem un text"
  area: "Producció escrita"
  goal: "Comparar un esborrany fictici amb una revisió d’IA sense acceptar canvis automàticament."
  simple: "Corregix este text en [idioma]."
  context: "Revisió d’un correu, ressenya o text argumentatiu fictici."
  students: "EOI d’[idioma], nivell [B1–C1]."
  objective: "Valorar adequació, cohesió, registre, correcció i possibles canvis de significat."
  restrictions: "Conserva la veu de l’autor, justifica cada canvi, distingix error de millora estilística i marca qualsevol alteració de significat. No reescrigues tot sense explicació."
  format: "Taula fragment original–proposta–motiu–decisió de l’estudiant i versió final."
  iteration: "Revisa els suggeriments: retira canvis innecessaris, assenyala dues alternatives vàlides i adapta el registre al destinatari sense elevar artificialment el nivell."
  result: "Una revisió argumentada en què l’alumnat decidix quins canvis accepta."
