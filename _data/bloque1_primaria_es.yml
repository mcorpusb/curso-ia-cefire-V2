- id: PRI-01
  title: "El supermercado de los números"
  area: "Matemáticas"
  goal: "Crear un supermercado ficticio para practicar operaciones, estimación y decisiones de compra."
  simple: "Crea problemas de matemáticas sobre un supermercado."
  context: "Taller de resolución de problemas con precios ficticios y compra responsable."
  students: "[curso de Primaria]; indica qué operaciones domina el grupo."
  objective: "Estimar, calcular y explicar estrategias al resolver una compra."
  restrictions: "12 productos, precios adecuados al curso, presupuesto cerrado, tres retos graduados y soluciones razonadas; sin marcas reales. Comprueba todas las operaciones y el cambio."
  format: "Lista de precios, tres misiones, apoyos opcionales y soluciones separadas para el docente."
  iteration: "Adapta el mismo supermercado a [curso], mantén los productos y cambia la dificultad. Comprueba de nuevo cada cálculo y explica qué ha cambiado en la exigencia cognitiva."
  result: "Una actividad matemática graduada, lista para revisar e imprimir."
- id: PRI-02
  title: "Detectives de noticias"
  area: "Lengua y pensamiento crítico"
  goal: "Comparar textos ficticios y aprender a distinguir hechos, opiniones, pistas y preguntas pendientes."
  simple: "Haz una actividad sobre noticias falsas."
  context: "Comprensión lectora y alfabetización mediática con textos totalmente ficticios."
  students: "5.º de Primaria; experiencia inicial en diferenciar hecho y opinión."
  objective: "Justificar la fiabilidad de una noticia mediante evidencias del texto y preguntas de verificación."
  restrictions: "Dos noticias breves sobre el mismo hecho escolar ficticio, una más fiable que otra; lenguaje apropiado, sin alarmismo ni enlaces inventados. Incluye pistas, solución razonada y aviso de que hay que contrastar."
  format: "Dos textos, tabla de evidencias, seis preguntas y guía docente separada."
  iteration: "Elimina pistas demasiado evidentes, añade una afirmación que requiera buscar una fuente pública y explica qué fuente sería adecuada sin inventar referencias."
  result: "Una mini investigación de lectura crítica con materiales ficticios y pautas de contraste."
- id: PRI-03
  title: "Nuestro colegio sostenible"
  area: "Conocimiento del Medio"
  goal: "Plantear retos de mejora sobre residuos, agua o energía vinculados al colegio."
  simple: "Prepara una actividad sobre sostenibilidad."
  context: "Situación de aprendizaje breve sobre un problema ambiental observable del centro."
  students: "4.º–6.º de Primaria, trabajo cooperativo en equipos."
  objective: "Interpretar datos ficticios, proponer una mejora viable y justificar cómo medir su efecto."
  restrictions: "Elige residuos, agua o energía; usa datos claramente marcados como simulados, tres pequeños retos, materiales comunes y una acción realizable sin obras ni gasto. No presentes estimaciones como mediciones reales."
  format: "Caso, tabla de datos, retos, plantilla de propuesta y preguntas para evaluar la viabilidad."
  iteration: "Introduce una restricción nueva —presupuesto máximo de 30 euros— y pide que priorice las medidas con criterios transparentes sin inventar datos del centro."
  result: "Un reto sostenible con datos ficticios y una propuesta verificable."
  adaptation: "En Infantil puede centrarse en clasificar residuos; en Secundaria, en consumo energético; en FP, en eficiencia técnica."
- id: PRI-04
  title: "Aprendemos historia con preguntas"
  area: "Historia local y patrimonio"
  goal: "Preparar una indagación sobre patrimonio local basada en preguntas y fuentes comprobables."
  simple: "Cuéntame la historia de un monumento de mi localidad."
  context: "Investigación guiada sobre [lugar o elemento patrimonial] usando únicamente fuentes aportadas por el docente o enlaces institucionales verificados."
  students: "6.º de Primaria; iniciación al uso de fuentes."
  objective: "Diferenciar lo que una fuente afirma, lo que permite inferir y lo que aún debe investigarse."
  restrictions: "No inventes fechas, personajes, citas ni fuentes; marca con ‘dato por verificar’ cualquier aspecto no sustentado. Formula preguntas antes de explicar y separa hechos de interpretaciones."
  format: "Guion con ocho preguntas, tabla fuente–evidencia y síntesis final de 150 palabras."
  iteration: "Audita tu respuesta: enumera cada afirmación histórica, vincúlala a una fuente aportada y retira o marca las que no estén sustentadas."
  result: "Una investigación guiada cuya información puede rastrearse hasta fuentes reales."
- id: PRI-05
  title: "Creamos ritmos con objetos cotidianos"
  area: "Música"
  goal: "Diseñar una creación rítmica cooperativa con percusión corporal y objetos seguros del aula."
  simple: "Haz una actividad para crear ritmos."
  context: "Sesión musical cooperativa sin instrumentos específicos."
  students: "3.º–6.º de Primaria, con experiencia musical diversa."
  objective: "Reconocer patrones, mantener el pulso y coordinar una composición breve en grupo."
  restrictions: "25 minutos, volumen moderado, objetos seguros, patrones de 4 y 8 pulsos, roles alternativos y opción sin impacto sonoro. No uses objetos frágiles ni contacto corporal."
  format: "Calentamiento, tres patrones escritos con notación accesible, creación por equipos y cierre de escucha."
  iteration: "Simplifica un patrón y amplía otro sin cambiar el pulso; añade apoyos visuales y una alternativa para alumnado sensible al ruido."
  result: "Una secuencia musical cooperativa con patrones y alternativas de participación."
  adaptation: "En Infantil enlaza emoción y movimiento; en Secundaria puede convertirse en paisaje sonoro."
- id: PRI-06
  title: "Mi primer algoritmo"
  area: "Pensamiento computacional"
  goal: "Trabajar secuencias, decisiones y depuración sin necesidad de programar."
  simple: "Crea una actividad sobre algoritmos para niños."
  context: "Reto desenchufado: guiar un robot ficticio por un laberinto o describir una receta."
  students: "4.º–6.º de Primaria; no se requieren conocimientos de programación."
  objective: "Escribir instrucciones precisas, detectar ambigüedades y corregir una secuencia."
  restrictions: "Incluye secuencia, una decisión ‘si… entonces…’, un error deliberado y pruebas sobre papel; no uses dispositivos ni datos personales. Ofrece apoyo con tarjetas de acciones."
  format: "Tablero o situación textual, instrucciones, casos de prueba, pistas graduadas y solución explicada."
  iteration: "Introduce un obstáculo nuevo y pide modificar el menor número posible de pasos. Comprueba la solución ejecutándola paso a paso."
  result: "Un reto desenchufado con algoritmo, prueba y depuración."
  adaptation: "En Infantil se limita a ordenar acciones; en Secundaria pasa a pseudocódigo y en FP a pruebas de software."
- id: PRI-07
  title: "Una tarea, diferentes caminos"
  area: "DUA e inclusión"
  goal: "Adaptar una tarea común sin rebajar su objetivo esencial."
  simple: "Adapta esta actividad para alumnado con dificultades."
  context: "Una actividad de Ciencias o Lengua que el docente describirá sin aportar perfiles identificables."
  students: "Grupo heterogéneo de Primaria; usa necesidades funcionales ficticias, no diagnósticos."
  objective: "Mantener el aprendizaje común y ofrecer diferentes formas de acceso, apoyo y expresión."
  restrictions: "Aplica DUA, propone tres niveles de andamiaje, lenguaje respetuoso y opciones oral, escrita, visual o manipulativa. No reduzcas el objetivo ni asignes adaptaciones a etiquetas personales."
  format: "Tabla barrera–apoyo–evidencia de aprendizaje y tres versiones de instrucciones."
  iteration: "Compara las tres rutas, detecta si alguna cambia el objetivo esencial y corrígela para que varíe el apoyo, no la expectativa de aprendizaje."
  result: "Una actividad accesible con rutas equivalentes y criterios comunes."

