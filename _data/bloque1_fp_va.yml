- id: FP-01
  title: "Edificació i Obra Civil — Habitatge sostenible"
  area: "Edificació i Obra Civil"
  goal: "Comparar solucions d’aïllament i eficiència energètica en un cas tècnic fictici."
  simple: "Dissenya un habitatge sostenible."
  context: "Avantprojecte simulat de millora d’un habitatge en clima mediterrani."
  students: "Cicle d’Edificació i Obra Civil; nivell [GM/GS]."
  objective: "Comparar materials mitjançant prestacions, cost i limitacions, i justificar una recomanació."
  restrictions: "Dades i preus ficticis clarament assenyalats, tres solucions, unitats coherents, càlculs traçables i aspectes tècnics per verificar. No cites normativa inexistent ni afirmes certificacions."
  format: "Fitxa del cas, taula comparativa, càlcul simplificat, recomanació i llista de comprovacions tècniques."
  iteration: "Limita el pressupost a [quantitat], revisa unitats i càlculs i separa les dades simulades dels valors que caldria obtindre de fitxes tècniques reals."
  result: "Un cas tècnic comparatiu amb supòsits i verificacions visibles."
  adaptation: "En Primària se centra en hàbits sostenibles; en Secundària, en consum energètic."
- id: FP-02
  title: "Integració Social — Intervenció inclusiva"
  area: "Servicis Socioculturals"
  goal: "Dissenyar una intervenció socioeducativa avaluable per a un centre comunitari fictici."
  simple: "Fes un projecte d’integració social."
  context: "Centre comunitari fictici que vol augmentar la participació en una activitat compartida."
  students: "Cicle d’Integració Social; treball amb perfils i dades completament ficticis."
  objective: "Relacionar necessitats, objectius, activitats, recursos i indicadors d’avaluació."
  restrictions: "Evita diagnòstics, estereotips i promeses d’impacte; inclou participació de les persones destinatàries, accessibilitat, recursos limitats i protocol de revisió professional."
  format: "Matriu necessitat–objectiu–activitat–recurs–indicador, cronograma breu i riscos."
  iteration: "Revisa la coherència vertical de la matriu i substituïx indicadors vagues per senyals observables i assolibles sense arreplegar dades sensibles."
  result: "Un projecte socioeducatiu coherent, respectuós i avaluable."
- id: FP-03
  title: "DAM — Depurem una aplicació Java"
  area: "Desenvolupament d’Aplicacions Multiplataforma"
  goal: "Localitzar dos errors lògics en una aplicació Java senzilla d’inventari."
  simple: "Genera un programa Java amb errors per a practicar."
  context: "Pràctica de depuració d’una aplicació d’inventari fictici."
  students: "1r de DAM; coneixen classes, mètodes, col·leccions i control de flux."
  objective: "Dissenyar proves, localitzar fallades, explicar causes i corregir el codi."
  restrictions: "Màxim 60 línies, dos errors lògics deliberats, sense xarxa, fitxers, credencials ni codi nociu; no reveles inicialment la solució. Inclou casos de prova i pistes progressives."
  format: "Enunciat, codi compilable, taula de proves, pistes, solució raonada i dues millores."
  iteration: "Adapta la dificultat a alumnat principiant: conserva les dues fallades, simplifica l’estructura i millora les pistes sense revelar directament les línies errònies."
  result: "Una pràctica Java segura amb proves i solució explicada."
- id: FP-04
  title: "DAW — Dissenyem una web accessible"
  area: "Desenvolupament d’Aplicacions Web"
  goal: "Crear una pàgina bàsica i auditar-ne de manera raonada l’accessibilitat."
  simple: "Crea una web accessible amb un formulari."
  context: "Pàgina fictícia d’inscripció a una jornada escolar."
  students: "1r de DAW; coneixen HTML semàntic i CSS bàsic."
  objective: "Relacionar estructura semàntica, formularis, teclat, focus i disseny adaptable."
  restrictions: "HTML i CSS breus, sense dependències, etiquetes explícites, missatges d’error comprensibles, focus visible i ordre lògic. No afirmes conformitat WCAG completa sense avaluació real."
  format: "Codi separat, llista de comprovacions manuals i troballes amb prioritat."
  iteration: "Audita el codi generat amb teclat i criteris bàsics d’accessibilitat; identifica límits de la revisió automàtica i entrega una versió corregida explicant cada canvi."
  result: "Un prototip web i una auditoria bàsica que no confon revisió amb certificació."
- id: FP-05
  title: "SMR — Diagnostiquem una xarxa local"
  area: "Sistemes Microinformàtics i Xarxes"
  goal: "Resoldre una incidència simulada de connectivitat seguint una seqüència de diagnòstic."
  simple: "Crea una avaria de xarxa per a resoldre."
  context: "Un equip fictici no accedix a un servidor de laboratori."
  students: "1r de SMR; coneixen IPv4, màscara, porta d’enllaç i DNS."
  objective: "Formular hipòtesis, interpretar eixides simulades i aïllar la causa abans de proposar canvis."
  restrictions: "Només IP privades i dominis reservats, eixides fictícies d’ipconfig/ip/ping/nslookup, sense credencials ni infraestructura real. Inclou una única causa inicial i solució raonada."
  format: "Tiquet, topologia textual, eixides, taula hipòtesi–prova–resultat, pistes i solució."
  iteration: "Afig una segona incidència de DNS sense alterar la primera. Actualitza les eixides simulades i explica com distingir les dues fallades."
  result: "Una pràctica reproduïble de diagnòstic amb dades segures i fictícies."
- id: FP-06
  title: "ASIR i Xarxes — Dissenya i verifica una xarxa empresarial"
  area: "Administració de Sistemes i Xarxes"
  goal: "Dissenyar una xarxa segmentada i comprovar-ne l’adreçament en simulació."
  simple: "Dissenya la xarxa d’una empresa menuda."
  context: "Empresa fictícia amb Administració, Vendes, Taller i servidors."
  students: "ASIR o mòdul avançat de xarxes; treball en simulador quan estiga disponible."
  objective: "Planificar subxarxes, VLAN, encaminament i proves de connectivitat amb mesures bàsiques de seguretat."
  restrictions: "Rangs privats ficticis, quatre departaments, requisits d’amfitrions, taula VLAN, topologia lògica i regles mínimes; no uses xarxes, noms ni credencials reals. No presentes la configuració com a verificada."
  format: "Pla d’adreçament, taula de ports/VLAN, diagrama textual, configuracions orientatives i pla de proves."
  iteration: "Audita el pla d’adreçament, detecta solapaments o portes d’enllaç invàlides i genera una taula corregida. Assenyala què comprovar en Packet Tracer."
  result: "Un disseny de xarxa llest per a validar en simulació, amb conflictes corregits."
- id: FP-07
  title: "Administració i Finances — Quant costa realment?"
  area: "Administració i Finances"
  goal: "Simular pressupost, marges i control de gastos en una empresa menuda fictícia."
  simple: "Fes un pressupost per a una empresa."
  context: "Empresa menuda fictícia que prepara el seu pressupost mensual."
  students: "Cicle d’Administració i Finances; nivell adaptable."
  objective: "Calcular ingressos, costos, marge i desviacions i justificar decisions."
  restrictions: "Dades fictícies coherents, costos fixos i variables, impostos simplificats clarament indicats, tres escenaris i fórmules visibles. Comprova operacions; no ho presentes com a assessorament fiscal."
  format: "Taula d’operacions, resultats per escenari, cinc preguntes i solució."
  iteration: "Modifica els preus un [percentatge], recalcula marges i comprova cada fórmula. Explica quins supòsits limiten la conclusió."
  result: "Una simulació pressupostària amb càlculs auditables i escenaris."
- id: FP-08
  title: "Desenvolupament de programari — Proves i qualitat"
  area: "DAM i DAW"
  goal: "Traduir requisits d’una funció senzilla en casos de prova útils."
  simple: "Genera proves per a una aplicació."
  context: "Funció fictícia de registre que valida usuari, contrasenya i edat."
  students: "DAM/DAW; coneixen requisits i proves unitàries bàsiques."
  objective: "Derivar entrades vàlides, invàlides i límit i comparar resultats esperats i reals."
  restrictions: "Requisits clars, dades fictícies, sense credencials reals, casos positius, negatius i de frontera; inclou dos requisits ambigus perquè l’alumnat els detecte."
  format: "Taula id–requisit–precondició–entrada–resultat esperat–prioritat i apartat d’incidències."
  iteration: "Revisa la cobertura, afig els casos límit que falten i reformula els requisits ambigus abans d’actualitzar els resultats esperats."
  result: "Un pla de proves traçable amb ambigüitats i millores identificades."
  adaptation: "En Primària partix de provar seqüències; en Secundària, de depurar un programa breu."
- id: FP-09
  title: "Comerç — Dissenyem un aparador que ven"
  area: "Comerç i Màrqueting"
  goal: "Planificar un aparador de temporada relacionant públic, concepte visual, pressupost i indicadors."
  simple: "Prepara una activitat sobre aparadorisme."
  context: "Cas professional per a una botiga fictícia de roba sostenible durant una campanya de temporada."
  students: "Cicle formatiu d’Activitats Comercials."
  objective: "Justificar decisions d’aparadorisme segons el públic objectiu, l’espai, els recursos i la finalitat comercial."
  restrictions: "Pressupost fictici de 350 euros, productes i botiga inventats, recursos realistes, criteris d’accessibilitat i seguretat; no atribuïsques resultats de venda reals."
  format: "Cas professional, instruccions, esquema de distribució, taula de recursos i costos i indicadors senzills."
  iteration: "Adapta l’aparador a un espai de 2 metres d’ample i un pressupost màxim de 180 euros. Conserva el concepte de campanya i justifica quins elements prioritzes o elimines."
  result: "Una proposta d’aparador coherent, pressupostada i justificable."
  adaptation: "En Primària enllaça amb el supermercat i les operacions; en Secundària, amb pressupost i consum responsable."
- id: FP-10
  title: "Màrqueting — Llancem una campanya digital"
  area: "Màrqueting i Publicitat"
  goal: "Dissenyar una campanya digital ètica i mesurable per a un producte sostenible fictici."
  simple: "Crea una campanya de màrqueting."
  context: "Empresa fictícia que vol llançar una botella reutilitzable."
  students: "Cicle formatiu de Màrqueting i Publicitat."
  objective: "Relacionar segmentació, proposta de valor, missatges, canals, pressupost i indicadors."
  restrictions: "Públic objectiu fictici, objectius mesurables, tres publicacions, calendari setmanal, pressupost simulat, indicadors i comunicació ètica. No uses perfils personals reals ni afirmacions ambientals sense suport."
  format: "Taules d’estratègia, publicacions, calendari, pressupost i indicadors amb supòsits explícits."
  iteration: "Canvia el públic objectiu de [segment inicial] a [segment nou]. Reescriu els missatges i canals, conserva el pressupost i compara quines decisions han canviat i per què."
  result: "Una campanya setmanal segmentada, avaluable i respectuosa amb la comunicació ètica."
  adaptation: "En Primària pot analitzar anuncis senzills; en Secundària, consum responsable i viabilitat econòmica."
- id: FP-11
  title: "Estètica — Dissenyem una atenció professional personalitzada"
  area: "Imatge Personal"
  goal: "Simular una atenció estètica segura, respectuosa i limitada a l’àmbit professional no sanitari."
  simple: "Prepara una activitat d’estètica."
  context: "Atenció a una clienta fictícia que sol·licita un servici bàsic de cura estètica facial."
  students: "Cicle formatiu d’Estètica i Bellesa."
  objective: "Fer una entrevista professional, identificar preferències, proposar cures cosmètiques generals i reconéixer quan cal derivar."
  restrictions: "Perfils ficticis, preguntes de seguretat, higiene, productes justificats i criteris d’atenció; no faces diagnòstics mèdics ni recomanacions clíniques i marca contraindicacions que requerisquen derivació."
  format: "Guió de recepció i entrevista, fitxa professional anonimitzada, proposta, productes, seguretat i llista d’observació."
  iteration: "Adapta la proposta a una clienta fictícia amb pressupost limitat i preferència per productes sense perfum. No pressuposes que siguen adequats per a totes les persones: indica què ha de comprovar la professional."
  result: "Una simulació d’assessorament amb límits, seguretat i comunicació professional explícits."
- id: FP-12
  title: "Perruqueria — Assessorament d’imatge i servici"
  area: "Perruqueria i Cosmètica Capil·lar"
  goal: "Preparar una entrevista i una proposta de servici que responguen a preferències, temps i manteniment."
  simple: "Dissenya una activitat sobre perruqueria."
  context: "Supòsit pràctic per a una clienta fictícia que desitja un canvi d’estil."
  students: "Cicle formatiu de Perruqueria i Cosmètica Capil·lar."
  objective: "Arreplegar expectatives, comparar opcions de tall i pentinat i justificar un servici viable i segur."
  restrictions: "Inclou temps, material, pressupost, higiene i comunicació professional. No diagnostiques cuir cabellut o cabell ni proposes procediments químics sense avaluació professional i mesures de seguretat."
  format: "Fitxa d’entrevista, tres opcions comparades, proposta raonada, planificació del servici i criteris d’observació."
  iteration: "Adapta la proposta a un servici de baix manteniment que s’haja de completar en 60 minuts. Explica quina opció descartes i per què."
  result: "Una simulació d’assessorament capil·lar amb alternatives, pressupost i límits professionals."
- id: FP-13
  title: "Hostaleria — Dissenyem un menú sostenible"
  area: "Cuina i Gastronomia"
  goal: "Planificar un menú de tres plats calculant quantitats, cost i organització amb criteris de sostenibilitat."
  simple: "Prepara un menú per a un restaurant."
  context: "Restaurant fictici de la Comunitat Valenciana que prepara un servici per a deu comensals."
  students: "Cicles de Cuina i Gastronomia o Direcció de Cuina."
  objective: "Fer un escandall simplificat, raonar el preu i organitzar el treball reduint deixalles."
  restrictions: "Ingredients de temporada, quantitats per a deu, costos orientatius ficticis, higiene alimentària i al·lèrgens per verificar. No garantisques absència d’al·lèrgens sense revisar ingredients, traces i manipulació."
  format: "Taules de menú, quantitats, escandall, preu, organització, al·lèrgens pendents i aprofitament."
  iteration: "Crea una alternativa vegetariana, recalcula quantitats, costos i preu pas a pas i explica quins al·lèrgens i fitxes tècniques s’han de tornar a verificar."
  result: "Un menú professional simulat amb escandall i comprovacions alimentàries pendents identificades."
  adaptation: "En Infantil pot classificar aliments; en Primària, planificar un desdejuni com a activitat educativa general; en Secundària, treballar pressupost i consum responsable."
- id: FP-14
  title: "Jardineria i Medi Ambient — Un jardí adaptat al clima mediterrani"
  area: "Jardineria, Paisatgisme i Medi Natural"
  goal: "Dissenyar un espai verd sostenible considerant clima, aigua, biodiversitat, manteniment i context local."
  simple: "Dissenya un jardí sostenible."
  context: "Jardí mediterrani fictici de 100 m² en un centre educatiu de la província d’Alacant."
  students: "Cicles de Jardineria, Paisatgisme o Medi Natural."
  objective: "Justificar distribució, espècies, reg, materials i manteniment amb criteris de sostenibilitat."
  restrictions: "Condicions climàtiques generals, ombra, espècies proposades, reg orientatiu, pressupost fictici i biodiversitat. Advertix que cal comprovar sòl, aigua, espècies invasores, disponibilitat comercial i condicions locals."
  format: "Fitxa de l’emplaçament, plànol textual per zones, taula d’espècies i recursos, pressupost, manteniment i llista de verificacions."
  iteration: "Adapta el disseny a restriccions d’aigua més severes. Reduïx la demanda estimada, justifica canvis d’espècies i distribució i assenyala quines dades locals necessites abans de validar la proposta."
  result: "Un avantprojecte de jardí mediterrani amb pressupost, manteniment i límits tècnics visibles."
  adaptation: "En Infantil enllaça amb plantar una llavor; en Primària, amb cuidar un hort; en Secundària, amb automatitzar el reg."

