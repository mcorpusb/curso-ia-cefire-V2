<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de la legislación educativa para un cuaderno docente</title>
  <desc id="desc">La normativa estatal, la normativa autonómica y las instrucciones del curso 2026-2027 conducen a un cuaderno docente. Desde él se ramifican Infantil, Primaria, ESO, Bachillerato, Formación Profesional y Escuelas Oficiales de Idiomas.</desc>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#213547}.h{font-size:30px;font-weight:700}.t{font-size:21px;font-weight:700}.s{font-size:16px}.box{fill:#fff;stroke:#9eb2d0;stroke-width:2}.main{fill:#eaf2ff;stroke:#4a67a1;stroke-width:3}.line{stroke:#7890b7;stroke-width:4;fill:none}.stage{fill:#f2f7ff;stroke:#7f9ac5;stroke-width:2}
  </style>
  <text x="600" y="54" text-anchor="middle" class="h">De la norma oficial al cuaderno docente</text>
  <path class="line" d="M220 180H360M560 180H690M890 180H980V315H600"/>
  <rect class="box" x="30" y="120" rx="16" width="190" height="120"/>
  <text x="125" y="165" text-anchor="middle" class="t">1 · Estado</text><text x="125" y="198" text-anchor="middle" class="s">LOE · reales decretos</text>
  <rect class="box" x="360" y="120" rx="16" width="200" height="120"/>
  <text x="460" y="165" text-anchor="middle" class="t">2 · Comunitat</text><text x="460" y="198" text-anchor="middle" class="s">Decretos y órdenes</text>
  <rect class="box" x="690" y="120" rx="16" width="200" height="120"/>
  <text x="790" y="165" text-anchor="middle" class="t">3 · Curso</text><text x="790" y="198" text-anchor="middle" class="s">Instrucciones 2026-2027</text>
  <rect class="main" x="420" y="280" rx="20" width="360" height="110"/>
  <text x="600" y="326" text-anchor="middle" class="t">4 · Cuaderno docente</text><text x="600" y="360" text-anchor="middle" class="s">Fuentes seleccionadas + citas verificables</text>
  <path class="line" d="M600 390V445M600 445H105M600 445H1095M105 445V490M303 445V490M501 445V490M699 445V490M897 445V490M1095 445V490"/>
  <g class="s" text-anchor="middle">
    <rect class="stage" x="25" y="490" rx="14" width="160" height="92"/><text x="105" y="535" class="t">Infantil</text><text x="105" y="562">0-3 · 3-6</text>
    <rect class="stage" x="223" y="490" rx="14" width="160" height="92"/><text x="303" y="545" class="t">Primaria</text>
    <rect class="stage" x="421" y="490" rx="14" width="160" height="92"/><text x="501" y="545" class="t">ESO</text>
    <rect class="stage" x="619" y="490" rx="14" width="160" height="92"/><text x="699" y="545" class="t">Bachillerato</text>
    <rect class="stage" x="817" y="490" rx="14" width="160" height="92"/><text x="897" y="535" class="t">Formación</text><text x="897" y="562" class="t">Profesional</text>
    <rect class="stage" x="1015" y="490" rx="14" width="160" height="92"/><text x="1095" y="545" class="t">EOI</text>
  </g>
  <rect x="180" y="625" width="840" height="56" rx="12" fill="#fff7e8" stroke="#d9a441" stroke-width="2"/>
  <text x="600" y="660" text-anchor="middle" class="s">Comprueba ámbito, vigencia, modificaciones, transitorios y cada cita antes de aplicar el resultado.</text>
</svg>
