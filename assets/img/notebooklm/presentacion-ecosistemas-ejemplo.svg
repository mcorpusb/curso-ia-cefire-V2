<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa ilustrativa de una presentación sobre ecosistemas</title><desc id="desc">Tres diapositivas: portada, conceptos principales y actividad de comprensión.</desc>
  <defs><style>.h{font:700 18px system-ui,sans-serif;fill:#243b53}.t{font:500 14px system-ui,sans-serif;fill:#40566d}.s{fill:#fff;stroke:#a9bacb;stroke-width:2}</style></defs><rect width="900" height="440" rx="20" fill="#f8fafc"/>
  <g class="s"><rect x="25" y="65" width="270" height="300" rx="12"/><rect x="315" y="65" width="270" height="300" rx="12"/><rect x="605" y="65" width="270" height="300" rx="12"/></g>
  <rect x="25" y="65" width="270" height="92" rx="12" fill="#dcecf8"/><text class="h" x="160" y="105" text-anchor="middle">ECOSISTEMAS</text><text class="t" x="160" y="132" text-anchor="middle">Seres vivos y entorno</text><circle cx="160" cy="244" r="55" fill="#e8f4ea" stroke="#75a67f" stroke-width="2"/><path d="M160 285v-72M160 230l-30-25M160 245l35-28" stroke="#5d8b68" stroke-width="5"/><text class="t" x="160" y="338" text-anchor="middle">1 · Portada</text>
  <text class="h" x="450" y="106" text-anchor="middle">Conceptos principales</text><circle cx="450" cy="200" r="42" fill="#eaf3fb"/><text class="t" x="450" y="205" text-anchor="middle">Hábitat</text><rect x="345" y="275" width="90" height="42" rx="8" fill="#e8f4ea"/><rect x="465" y="275" width="90" height="42" rx="8" fill="#fff1dc"/><text class="t" x="390" y="301" text-anchor="middle">Biótico</text><text class="t" x="510" y="301" text-anchor="middle">Abiótico</text><text class="t" x="450" y="338" text-anchor="middle">2 · Ideas clave</text>
  <text class="h" x="740" y="106" text-anchor="middle">Comprueba</text><text class="t" x="630" y="153">Observa un ecosistema cercano.</text><text class="t" x="630" y="187">1. Identifica 3 componentes.</text><text class="t" x="630" y="221">2. Explica una relación.</text><text class="t" x="630" y="255">3. Propón una mejora.</text><rect x="630" y="284" width="220" height="42" rx="8" fill="#eaf3fb"/><text class="t" x="740" y="310" text-anchor="middle">Comparte tu conclusión</text><text class="t" x="740" y="338" text-anchor="middle">3 · Actividad</text>
  <text class="t" x="450" y="408" text-anchor="middle">Ejemplo didáctico ilustrativo · No es una salida verificada de Gemini Notebook</text>
