<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Esquema ilustrativo de la interfaz de Gemini Notebook</title>
  <desc id="desc">Representación no literal con tres zonas: fuentes a la izquierda, conversación en el centro y herramientas de generación a la derecha.</desc>
  <defs><style>.h{font:700 19px system-ui,sans-serif;fill:#243b53}.t{font:500 16px system-ui,sans-serif;fill:#40566d}.p{fill:#fff;stroke:#b8c8d8;stroke-width:2}.a{fill:#eaf3fb;stroke:#6d97bd;stroke-width:2}</style></defs>
  <rect width="900" height="500" rx="20" fill="#f8fafc" stroke="#cbd5df" stroke-width="2"/>
  <rect x="24" y="24" width="852" height="52" rx="10" fill="#fff" stroke="#d7e0e8"/><circle cx="52" cy="50" r="8" fill="#759bc0"/><text class="h" x="72" y="57">Cuaderno educativo</text><text class="t" x="850" y="57" text-anchor="end">ESQUEMA ILUSTRATIVO</text>
  <rect class="p" x="24" y="96" width="230" height="380" rx="12"/><text class="h" x="44" y="130">Fuentes</text><rect class="a" x="44" y="151" width="190" height="48" rx="8"/><text class="t" x="60" y="181">Currículo oficial.pdf</text><rect class="p" x="44" y="215" width="190" height="48" rx="8"/><text class="t" x="60" y="245">Guía didáctica</text><rect class="p" x="44" y="279" width="190" height="48" rx="8"/><text class="t" x="60" y="309">Texto científico</text><rect x="44" y="412" width="190" height="42" rx="8" fill="#eaf6ef" stroke="#7daf91"/><text class="t" x="139" y="439" text-anchor="middle">+ Añadir fuente</text>
  <rect class="p" x="274" y="96" width="358" height="380" rx="12"/><text class="h" x="294" y="130">Conversación</text><rect x="294" y="151" width="298" height="84" rx="10" fill="#eef4fa"/><text class="t" x="312" y="181">¿Qué criterios respaldan</text><text class="t" x="312" y="207">esta actividad?</text><rect x="334" y="255" width="278" height="110" rx="10" fill="#fff" stroke="#b8c8d8"/><text class="t" x="352" y="286">Respuesta fundamentada…</text><text class="t" x="352" y="320">Cita 1 · Cita 2</text><rect x="294" y="412" width="318" height="42" rx="8" fill="#fff" stroke="#9fb4c8"/><text class="t" x="312" y="439">Pregunta sobre tus fuentes…</text>
  <rect class="p" x="652" y="96" width="224" height="380" rx="12"/><text class="h" x="672" y="130">Generar</text><g class="a"><rect x="672" y="151" width="184" height="48" rx="8"/><rect x="672" y="215" width="184" height="48" rx="8"/><rect x="672" y="279" width="184" height="48" rx="8"/><rect x="672" y="343" width="184" height="48" rx="8"/></g><text class="t" x="692" y="181">Presentación</text><text class="t" x="692" y="245">Vídeo</text><text class="t" x="692" y="309">Cuestionario</text><text class="t" x="692" y="373">Mapa conceptual</text>
</svg>
