<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Cicle d'aprenentatge amb IA</title>
  <desc id="desc">Diagrama circular amb cinc fases: veure, fer, comparar, verificar i aplicar.</desc>
  <rect width="1200" height="420" fill="#f8fbff"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Cicle d'aprenentatge amb IA</text>

  <circle cx="600" cy="230" r="130" fill="#ffffff" stroke="#d8e6f4" stroke-width="3"/>
  <text x="600" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4f7a">Criteri docent</text>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#184a73">
    <rect x="130" y="195" rx="10" ry="10" width="170" height="70" fill="#e9f3ff" stroke="#8db5dd"/>
    <text x="215" y="238" text-anchor="middle">1. Veure</text>

    <rect x="330" y="90" rx="10" ry="10" width="170" height="70" fill="#e9f3ff" stroke="#8db5dd"/>
    <text x="415" y="133" text-anchor="middle">2. Fer</text>

    <rect x="700" y="90" rx="10" ry="10" width="190" height="70" fill="#e9f3ff" stroke="#8db5dd"/>
    <text x="795" y="133" text-anchor="middle">3. Comparar</text>

    <rect x="900" y="195" rx="10" ry="10" width="190" height="70" fill="#e9f3ff" stroke="#8db5dd"/>
    <text x="995" y="238" text-anchor="middle">4. Verificar</text>

    <rect x="510" y="305" rx="10" ry="10" width="190" height="70" fill="#e9f3ff" stroke="#8db5dd"/>
    <text x="605" y="348" text-anchor="middle">5. Aplicar</text>
  </g>

  <g stroke="#5a88b6" stroke-width="3" fill="none">
    <path d="M300 230 L330 125"/>
    <path d="M500 125 L700 125"/>
    <path d="M890 125 L930 230"/>
    <path d="M900 260 L700 340"/>
    <path d="M510 340 L300 260"/>
  </g>

  <text x="600" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3f6586">Necessitat → Context/Fons → Resposta → Revisió → Verificació → Aplicació</text>
</svg>
