<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Avaluació del procés davant del producte</title>
  <desc id="desc">Comparativa visual entre avaluar només producte i avaluar el procés complet de treball amb IA.</desc>
  <rect width="1200" height="500" fill="#f7fbff"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Avaluació: procés vs. producte</text>

  <rect x="90" y="110" rx="12" ry="12" width="470" height="320" fill="#fff5f5" stroke="#e9aaaa" stroke-width="2"/>
  <text x="325" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a22b2b">Només producte final</text>
  <text x="130" y="205" font-family="Arial, sans-serif" font-size="18" fill="#7d3a3a">• Pot ocultar l'ajuda real de la IA</text>
  <text x="130" y="240" font-family="Arial, sans-serif" font-size="18" fill="#7d3a3a">• Difícil valorar decisions pedagògiques</text>
  <text x="130" y="275" font-family="Arial, sans-serif" font-size="18" fill="#7d3a3a">• Menys evidència d'aprenentatge</text>

  <rect x="640" y="110" rx="12" ry="12" width="470" height="320" fill="#f0f9f2" stroke="#9ed0ab" stroke-width="2"/>
  <text x="875" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d6c34">Procés complet</text>
  <text x="680" y="205" font-family="Arial, sans-serif" font-size="18" fill="#2f6a3f">• Definició de necessitat i context</text>
  <text x="680" y="240" font-family="Arial, sans-serif" font-size="18" fill="#2f6a3f">• Iteracions, revisió i verificació</text>
  <text x="680" y="275" font-family="Arial, sans-serif" font-size="18" fill="#2f6a3f">• Reflexió crítica i aplicació a l'aula</text>
  <text x="680" y="310" font-family="Arial, sans-serif" font-size="18" fill="#2f6a3f">• Evidències més sòlides d'aprenentatge</text>

  <line x1="560" y1="270" x2="640" y2="270" stroke="#5a88b6" stroke-width="4"/>
  <polygon points="640,270 622,260 622,280" fill="#5a88b6"/>

  <text x="600" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#3f6586">Objectiu del curs: valorar decisions, criteri docent i qualitat del procés de treball amb IA.</text>
</svg>
