<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Estructura del curs d'IA per a docents</title>
  <desc id="desc">Diagrama amb cinc blocs del curs: Bloc 0 i Blocs 1 a 4 amb les seues temàtiques.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17324d">Estructura del curs</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#355c7d">Intel·ligència Artificial Generativa per a docents</text>

  <rect x="70" y="140" rx="14" ry="14" width="200" height="125" fill="#ffffff" stroke="#8db5dd" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#184a73">Bloc 0</text>
  <text x="170" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#345f80">Què és la IA?</text>
  <text x="170" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#567894">Fonaments i criteri</text>

  <rect x="290" y="140" rx="14" ry="14" width="200" height="125" fill="#ffffff" stroke="#8db5dd" stroke-width="2"/>
  <text x="390" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#184a73">Bloc 1</text>
  <text x="390" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#345f80">IA col·laborativa</text>
  <text x="390" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#567894">Gestió docent</text>

  <rect x="510" y="140" rx="14" ry="14" width="200" height="125" fill="#ffffff" stroke="#8db5dd" stroke-width="2"/>
  <text x="610" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#184a73">Bloc 2</text>
  <text x="610" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#345f80">Fonts i verificació</text>
  <text x="610" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#567894">Prompting pedagògic</text>

  <rect x="730" y="140" rx="14" ry="14" width="200" height="125" fill="#ffffff" stroke="#8db5dd" stroke-width="2"/>
  <text x="830" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#184a73">Bloc 3</text>
  <text x="830" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#345f80">Generació multimodal</text>
  <text x="830" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#567894">Recursos didàctics</text>

  <rect x="950" y="140" rx="14" ry="14" width="180" height="125" fill="#ffffff" stroke="#8db5dd" stroke-width="2"/>
  <text x="1040" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#184a73">Bloc 4</text>
  <text x="1040" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#345f80">Avaluació</text>
  <text x="1040" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#567894">i personalització</text>

  <line x1="270" y1="202" x2="290" y2="202" stroke="#5a88b6" stroke-width="3"/>
  <line x1="490" y1="202" x2="510" y2="202" stroke="#5a88b6" stroke-width="3"/>
  <line x1="710" y1="202" x2="730" y2="202" stroke="#5a88b6" stroke-width="3"/>
  <line x1="930" y1="202" x2="950" y2="202" stroke="#5a88b6" stroke-width="3"/>

  <rect x="170" y="340" rx="12" ry="12" width="860" height="120" fill="#ffffff" stroke="#d6e3f0"/>
  <text x="600" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Cicle transversal del curs</text>
  <text x="600" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#355c7d">Necessitat → Context/Fons → Resposta → Revisió → Verificació → Aplicació</text>
</svg>
