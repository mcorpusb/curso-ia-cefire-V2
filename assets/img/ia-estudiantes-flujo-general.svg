<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-labelledby="title desc">
  <title id="title">Flujo para comprobar promociones educativas de inteligencia artificial</title>
  <desc id="desc">Ser docente y estudiante universitario lleva a comprobar promociones educativas, verificar la elegibilidad, activar una oferta si corresponde y revisar su finalización o renovación.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b237b"/>
    </marker>
  </defs>
  <rect width="760" height="820" rx="24" fill="#faf7fc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="70" y="42" width="270" height="104" rx="18" fill="#ffffff" stroke="#5b237b" stroke-width="4"/>
    <text x="205" y="87" font-size="28" font-weight="700" fill="#24132e">DOCENTE</text>
    <text x="205" y="120" font-size="20" fill="#4a3c52">situación profesional</text>
    <text x="380" y="109" font-size="44" font-weight="700" fill="#5b237b">+</text>
    <rect x="420" y="42" width="270" height="104" rx="18" fill="#ffffff" stroke="#5b237b" stroke-width="4"/>
    <text x="555" y="80" font-size="25" font-weight="700" fill="#24132e">ESTUDIANTE</text>
    <text x="555" y="112" font-size="22" font-weight="700" fill="#24132e">UNIVERSITARIO/A</text>
    <line x1="380" y1="166" x2="380" y2="211" stroke="#5b237b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="110" y="230" width="540" height="112" rx="18" fill="#eee3f5" stroke="#5b237b" stroke-width="4"/>
    <text x="380" y="277" font-size="25" font-weight="700" fill="#24132e">COMPROBAR PROMOCIONES</text>
    <text x="380" y="311" font-size="25" font-weight="700" fill="#24132e">EDUCATIVAS VIGENTES</text>
    <line x1="380" y1="362" x2="380" y2="407" stroke="#5b237b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="110" y="426" width="540" height="104" rx="18" fill="#eaf6ec" stroke="#287a36" stroke-width="4"/>
    <text x="380" y="489" font-size="28" font-weight="700" fill="#174c21">VERIFICAR ELEGIBILIDAD</text>
    <line x1="380" y1="550" x2="380" y2="595" stroke="#5b237b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="110" y="614" width="540" height="78" rx="18" fill="#ffffff" stroke="#5b237b" stroke-width="4"/>
    <text x="380" y="663" font-size="27" font-weight="700" fill="#24132e">ACTIVAR SI CORRESPONDE</text>
    <line x1="380" y1="712" x2="380" y2="748" stroke="#5b237b" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="380" y="790" font-size="25" font-weight="700" fill="#7a3e00">REVISAR FINALIZACIÓN O RENOVACIÓN</text>
  </g>
</svg>
