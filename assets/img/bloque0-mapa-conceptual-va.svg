<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Mapa conceptual del Bloc 0: Què és la IA?</title>
<desc id="desc">La IA generativa permet conversar i generar, treballar amb documents, buscar i investigar i executar processos. Els seus resultats requerixen revisar errors, fonts, biaixos i adequació al context. Les decisions professionals i la informació sensible requerixen supervisió humana. El cicle de treball és necessitat, context i fonts, primera resposta, revisió, verificació i aplicació.</desc>
<style>
.title{font:700 34px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
.branch-title{font:700 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
.text{font:18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}
.small{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}
.flow{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
.line{stroke:#64748b;stroke-width:3;fill:none}
</style>
<rect width="1200" height="920" rx="28" fill="#ffffff"/>
<rect x="400" y="40" width="400" height="90" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
<text x="600" y="96" text-anchor="middle" class="title">IA GENERATIVA</text>
<path d="M600 130 L600 170" class="line"/><path d="M600 170 L200 170 L200 215" class="line"/><path d="M600 170 L600 215" class="line"/><path d="M600 170 L1000 170 L1000 215" class="line"/>
<rect x="40" y="215" width="320" height="330" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
<text x="200" y="258" text-anchor="middle" class="branch-title">QUÈ PODEM FER</text>
<text x="75" y="310" class="text">• Conversar i generar</text><text x="75" y="355" class="text">• Treballar amb documents</text><text x="75" y="400" class="text">• Buscar i investigar</text><text x="75" y="445" class="text">• Executar processos</text>
<text x="75" y="500" class="small">Diferents eines poden</text><text x="75" y="525" class="small">combinar diverses capacitats.</text>
<rect x="440" y="215" width="320" height="330" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2.5"/>
<text x="600" y="258" text-anchor="middle" class="branch-title">QUÈ HEM DE REVISAR</text>
<text x="475" y="310" class="text">• Errors i al·lucinacions</text><text x="475" y="355" class="text">• Fonts i cites</text><text x="475" y="400" class="text">• Biaixos i absències</text><text x="475" y="445" class="text">• Adequació al context</text>
<text x="475" y="500" class="small">La fluïdesa i les cites no substituïxen</text><text x="475" y="525" class="small">la verificació humana.</text>
<rect x="840" y="215" width="320" height="330" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
<text x="1000" y="258" text-anchor="middle" class="branch-title">QUÈ NO HEM DE DELEGAR</text>
<text x="875" y="310" class="text">• Dades sensibles</text><text x="875" y="355" class="text">• Decisions sobre persones</text><text x="875" y="400" class="text">• Responsabilitat professional</text><text x="875" y="445" class="text">• Verificació crítica</text>
<text x="875" y="500" class="small">La responsabilitat final</text><text x="875" y="525" class="small">continua sent professional.</text>
<line x1="80" y1="600" x2="1120" y2="600" stroke="#e5e7eb" stroke-width="2"/>
<text x="600" y="650" text-anchor="middle" class="branch-title">EL CICLE QUE PRACTICAREM</text>
<rect x="35" y="700" width="150" height="70" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="110" y="742" text-anchor="middle" class="flow">NECESSITAT</text>
<path d="M185 735 L215 735" class="line"/><polygon points="215,735 203,728 203,742" fill="#64748b"/>
<rect x="220" y="700" width="170" height="70" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="305" y="728" text-anchor="middle" class="flow">CONTEXT</text><text x="305" y="749" text-anchor="middle" class="flow">/ FONTS</text>
<path d="M390 735 L420 735" class="line"/><polygon points="420,735 408,728 408,742" fill="#64748b"/>
<rect x="425" y="700" width="150" height="70" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="500" y="728" text-anchor="middle" class="flow">1a</text><text x="500" y="749" text-anchor="middle" class="flow">RESPOSTA</text>
<path d="M575 735 L605 735" class="line"/><polygon points="605,735 593,728 593,742" fill="#64748b"/>
<rect x="610" y="700" width="150" height="70" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="685" y="742" text-anchor="middle" class="flow">REVISIÓ</text>
<path d="M760 735 L790 735" class="line"/><polygon points="790,735 778,728 778,742" fill="#64748b"/>
<rect x="795" y="700" width="170" height="70" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="880" y="742" text-anchor="middle" class="flow">VERIFICACIÓ</text>
<path d="M965 735 L995 735" class="line"/><polygon points="995,735 983,728 983,742" fill="#64748b"/>
<rect x="1000" y="700" width="165" height="70" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1082" y="742" text-anchor="middle" class="flow">APLICACIÓ</text>
<rect x="260" y="820" width="680" height="58" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="600" y="855" text-anchor="middle" class="text">La IA proposa · el professorat revisa, verifica i decidix</text>
</svg>